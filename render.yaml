# Render Blueprint for the Roch Games static site.
# New > Blueprint, pick this repo, and Render creates a free static site
# named roch-games. /play/<slug> rewrites to play.html.
services:
  - type: web
    name: roch-games
    runtime: static
    buildCommand: node scripts/validate-games.js
    staticPublishPath: ./public
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /data/games.json
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
    routes:
      - type: rewrite
        source: /play/*
        destination: /play.html
